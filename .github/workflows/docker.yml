name: 构建并发布镜像

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

# 用仓库 Dockerfile 生成可直接部署的多架构镜像。
permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Go 校验
    runs-on: ubuntu-latest
    steps:
      - name: 获取代码
        uses: actions/checkout@v4
      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: 运行测试
        run: go test ./...
      - name: 静态检查
        run: go vet ./...
      - name: 校验浏览器会话
        run: node tests/browser_session.cjs browser.go

  docker:
    name: 构建 Docker 镜像
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 获取代码
        uses: actions/checkout@v4
      - name: 配置 QEMU
        uses: docker/setup-qemu-action@v3
      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3
      - name: 登录 GitHub 容器仓库
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 生成镜像标签
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/adobe2api
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
      - name: 构建并发布
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
